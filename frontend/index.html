<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAJ — talk your way fluent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Onboarding: shown first, in English, before any target-language practice -->
    <div id="onboarding" class="onboarding">
      <div class="onboarding-card">
        <div class="brand big">
          <span class="crown">♔</span>
          <h1>TAJ</h1>
        </div>
        <p class="welcome">
          Hi! I'm <strong>TAJ</strong>, your voice tutor. Let's set you up — it
          takes 10 seconds.
        </p>

        <label class="field">
          <span>I speak</span>
          <select id="ob-native"></select>
        </label>

        <label class="field">
          <span>I want to learn</span>
          <select id="ob-target"></select>
        </label>

        <label class="field">
          <span>My level</span>
          <select id="ob-level"></select>
        </label>

        <button id="ob-start" class="start-btn">Start learning →</button>
        <p id="ob-note" class="ob-note"></p>
      </div>
    </div>

    <!-- Main app: hidden until onboarding completes -->
    <div id="app" class="app hidden">
      <header>
        <div class="brand">
          <span class="crown">♔</span>
          <h1>TAJ</h1>
        </div>
        <div class="header-right">
          <button id="change" class="change-btn" title="Change language/level">⚙ Change</button>
          <div id="status" class="status">connecting…</div>
        </div>
      </header>

      <div id="banner" class="banner hidden"></div>

      <main>
        <section id="conversation" class="conversation" aria-live="polite"></section>

        <aside id="sidebar" class="sidebar">
          <h2>Corrections</h2>
          <ul id="corrections" class="corrections"></ul>
          <h2>Review deck</h2>
          <div id="deck" class="deck">—</div>
        </aside>
      </main>

      <footer>
        <button id="talk" class="talk" disabled>
          <span class="talk-label">Hold to speak</span>
        </button>
        <p class="hint">
          Hold the button (or the spacebar), speak, then release.
        </p>
      </footer>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
